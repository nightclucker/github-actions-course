name: 10 - Controlling the Execution Flow
on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                description: "Should the unit tests pass?"
                type: boolean
                default: true

jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: "Lint and Build"
              run: echo "Linting and building the code..."
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - name: "Running unit tests"
              run: echo "Running unit tests..."
            - name: "Failing tests"
              if: ${{ !inputs.pass-unit-tests }}
              run: exit 1