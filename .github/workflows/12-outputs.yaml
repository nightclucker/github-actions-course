name: 12 - Working with Outputs
on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                    - "success"
                    - "failure"
                default: "success"

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            build-status: ${{ steps.build.outputs.status }}
        steps:
            - name: Print GITHUB_OUTPUT path
              run: echo "GITHUB_OUTPUT path is $GITHUB_OUTPUT"
            - name: Build
              run: echo "status=${{ inputs.build-status }}" >> $GITHUB_OUTPUT
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy
              if: ${{ needs.build.outputs.build-status == 'success' }}
              run: echo "Deploying the code..."
            - name: Print build status
              run: echo "Build status is ${{ needs.build.outputs.status }}"
