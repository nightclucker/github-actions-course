name: "06 - Contexts"
run-name: "My custom workflow run name - DEBUG - ${{ inputs.debug }}"
on:
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

env:
    MY_WORKFLOW_ENV: "workflow"

jobs:
    echo-data:
        runs-on: ubuntu-latest
        steps:
            - name: "Display Information"
              run: |
                echo "Repository Name: ${{ github.repository }}"
                echo "Repository Owner: ${{ github.repository_owner }}"
                echo "Repository URL: ${{ github.server_url }}/${{ github.repository }}"
                echo "Workflow Name: ${{ github.workflow }}"
                echo "Workflow Run ID: ${{ github.run_id }}"
                echo "Workflow Run Number: ${{ github.run_number }}"
                echo "Job Name: ${{ github.job }}"
                echo "Actor: ${{ github.actor }}"
                echo "Event Name: ${{ github.event_name}}"
                echo "Event Path: ${{ github.event_path }}"
                echo "SHA: ${{ github.sha }}"
                echo "Ref: ${{ github.ref }}"
                echo "Run Number: ${{ github.run_number }}"
            - name: "Retrieve Variable"
              run: |
                echo "Variable Value: ${{ vars.MY_VARIABLE }}"
